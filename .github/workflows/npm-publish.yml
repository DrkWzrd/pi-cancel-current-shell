# Creates the GitHub release and publishes the package to npm.
# Trigger: push of a version tag (e.g. v1.0.0).
# Uses npm "trusted publishing" (OIDC): no npm token or secret is needed.
# One-time setup: add this repo + workflow file as a Trusted Publisher on npmjs.com.

name: Create release & publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # lets the workflow create the GitHub release
  id-token: write # lets GitHub prove to npm who is publishing

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Node 24 ships an npm new enough for trusted publishing (needs npm >= 11.5.1).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Fails early if the pushed tag (e.g. v1.0.1) doesn't match package.json's version.
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      # Create the GitHub release for this tag (idempotent: updates it on reruns).
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes"
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes "pi-cancel-current-shell $TAG"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "pi-cancel-current-shell $TAG" \
              --verify-tag
          fi

      - run: npm publish --access public
